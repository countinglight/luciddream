<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <mask id="owlMask">
      <rect width="200" height="200" fill="white"/>
      <circle cx="70" cy="90" r="22" fill="black"/>
      <circle cx="130" cy="90" r="22" fill="black"/>
      <polygon points="88,112 112,112 100,148" fill="black"/>
    </mask>
  </defs>

  <!-- Body/head with eye holes and beak notch cut out via mask -->
  <circle cx="100" cy="105" r="85" fill="#2C4870" mask="url(#owlMask)"/>

  <!-- Pupils -->
  <circle cx="70" cy="93" r="8" fill="#2C4870"/>
  <circle cx="130" cy="93" r="8" fill="#2C4870"/>

  <!-- Brows sticking out -->
  <polygon points="50,60 30,35 55,50" fill="#2C4870"/>
  <polygon points="150,60 170,35 145,50" fill="#2C4870"/>
</svg>
