name: Release Android (GitHub Release)

# Fires on the same version tag as release-ios.yml, so one tag push releases
# both platforms: this workflow builds the APK on EAS and publishes it as an
# asset on a GitHub Release, which is where testers get it (v1 spec §5.1).
# EAS is only where the APK is built; GitHub Releases stays where it lives, and
# the website reads the latest release through the public API.
#
# The APK is built with the `preview` profile so it is signed with the release
# key EAS holds. Local `npm run android:apk:release` output is signed with the
# debug keystore and must never be given to testers: the signatures differ, so
# a tester would have to uninstall and lose their data (evidence E-009).
on:
  push:
    tags:
      # Both spellings in use: `v0.6.0` and the bare `0.5.1` of the first
      # releases. The version check below strips a leading `v`.
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Two runs must never build at once: each would claim a build number from its
# own run counter, and the second release would publish an older APK.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # gh release create/upload writes to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes generated by gh need the history behind the tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # package.json is the canonical version source — app.config.js overrides
      # app.json's `version` from it. Checking app.json would validate a value
      # that never reaches the build.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg." >&2
            exit 1
          fi
          echo "Tag and package.json agree on $pkg."

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Report version and build number
        env:
          LUCIDDREAM_BUILD: ${{ github.run_number }}
        run: npm run version:info

      # --wait, because the following steps need the finished artifact. The
      # counter makes successive builds of the same version distinct, and is
      # always >= 1, so a CI build can never collide with a local one (pinned
      # to 0). Budget 15-25 min, more on the free queue.
      - name: Build APK on EAS
        id: build
        env:
          LUCIDDREAM_BUILD: ${{ github.run_number }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          url="$(node -e "const b=require('./build.json');const a=Array.isArray(b)?b[0]:b;const u=a.artifacts&&(a.artifacts.applicationArchiveUrl||a.artifacts.buildUrl);if(!u){console.error(JSON.stringify(a,null,2));throw new Error('no application archive in the EAS build result')}console.log(u)")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The asset keeps the name the Gradle build gives it locally
      # (plugins/withCanonicalVersion.js), so the file a tester downloads is
      # named for its version rather than an EAS build id.
      - name: Download the APK
        run: |
          version="$(node -p "require('./package.json').version")"
          curl -fsSL "${{ steps.build.outputs.url }}" -o "luciddream-v${version}-release.apk"
          ls -l "luciddream-v${version}-release.apk"

      # Notes come from doc/release/v<version>.md when it exists; its first
      # heading becomes the release title. Otherwise gh generates notes from
      # the commits since the previous tag.
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          apk="luciddream-v${version}-release.apk"
          notes="doc/release/v${version}.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; replacing its APK asset."
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
            exit 0
          fi

          if [ -f "$notes" ]; then
            title="$(sed -n 's/^# \(.*\)/\1/p' "$notes" | head -n 1)"
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "${title:-$GITHUB_REF_NAME}" --notes-file "$notes"
          else
            echo "No $notes; generating notes from commits."
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
