name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generated by Expo tooling on first run (expo start/expo lint) and
      # gitignored by convention; tsc needs it to resolve the ambient
      # *.css module declarations used by src/constants/theme.ts.
      - name: Generate expo-env.d.ts
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
